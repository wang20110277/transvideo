appId: com.manju2026.trans-video
productName: TRANSVIDEO
directories:
  buildResources: build
  output: release/build
files:
  - out/**/*
  - package.json
  # Desktop-only packaging guard: exclude web/image-toolchain heavy deps
  - "!node_modules/next/**"
  - "!node_modules/@next/**"
  - "!node_modules/sharp/**"
  - "!node_modules/@img/**"
  # renderer 转写 worker 静态 import transformers，Vite 已把 onnxruntime-web 打进 chunk；
  # node_modules 内的 onnxruntime 系是打包死重量（+30-60MB/平台），且 asarUnpack **/*.node 会额外解包其原生件
  - "!node_modules/onnxruntime-*/**"
  - "!node_modules/@huggingface/**"

extraResources:
  - from: demo-data
    to: demo-data
    filter:
      - "**/*"
  # smartsub 运行时资源:落地 Resources/extraResources/smartsub,
  # 与 getExtraResourcesPath()(process.resourcesPath/extraResources/smartsub)对齐
  - from: smartsub-resources
    to: extraResources/smartsub
    filter:
      - "**/*"

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/ffmpeg-static/bin/${os}/${arch}/ffmpeg"
  - "node_modules/ffmpeg-static/index.js"
  - "node_modules/ffmpeg-static/package.json"
  - "node_modules/ffmpeg-static/ffmpeg"
  - "node_modules/ffmpeg-static/ffmpeg.exe"
  - "node_modules/ffmpeg-static/ffmpeg.macos"
  - "node_modules/ffmpeg-static/ffmpeg.linux"
  - "node_modules/ffmpeg-static/ffmpeg.win32"

# 图标配置
icon: build/icon.ico

mac:
  icon: build/icon.icns
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: "TRANSVIDEO 需要使用麦克风录制您的声音以创建克隆音色(字幕配音功能)。"
  target:
    - dmg
    - zip

win:
  executableName: trans-video
  icon: build/icon.ico
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装包配置
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: TRANSVIDEO
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
